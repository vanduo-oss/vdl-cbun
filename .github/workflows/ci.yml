name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm lint
      - run: pnpm run format:check
      - run: pnpm run stylelint
      - run: pnpm test
      - run: pnpm run build

      # Type-test harness: `tsc --noEmit` over tests/types. It resolves the
      # package's own "exports" map (self-reference) to the built dist/*.d.ts,
      # so it must run AFTER `pnpm run build`.
      - run: pnpm run test:types

      # Playwright rendering smoke (Chromium only). The fixtures import the
      # built dist ESM entries, so this also runs after the build.
      - name: E2E (Playwright, Chromium)
        run: |
          npx playwright install --with-deps chromium
          pnpm run test:e2e
